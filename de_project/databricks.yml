# This is a Declarative Automation Bundle definition for de_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: de_project
  uuid: d90569cd-1836-43fe-8f9a-32c3b2733040

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5900cfd5-17f5.cloud.databricks.com
    variables:
      catalog: de_dev

  uat:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    workspace:
      host: https://dbc-5900cfd5-17f5.cloud.databricks.com
    variables:
      catalog: de_uat

  prod:
    mode: production
    workspace:
      host: https://dbc-5900cfd5-17f5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rahulpatel@cyntexa.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rahulpatel@cyntexa.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: de_prod

    permissions:
      - user_name: rahulpatel@cyntexa.com
        level: CAN_MANAGE
